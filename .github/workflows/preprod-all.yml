name: Docker Debug

on:
  push:
    branches:
      - 'pre'

jobs:
  check_out:
    name: check out
    runs-on: [self-hosted, linux, x64, pre]
    steps:
      - name: Stop old containers
        run: sudo docker stop $(docker ps -a -q)
        continue-on-error: true
      - name: Remove old containers
        run: sudo docker rm $(docker ps -a -q)
        continue-on-error: true
      - name: Remove old images
        run: sudo docker rmi $(docker images -a -q)
        continue-on-error: true
      - name: Clear all Docker
        run: sudo docker system prune --all -f || true

  docker_compose:
    name: docker compose
    needs: check_out
    runs-on: [self-hosted, linux, x64, pre]
    steps:
      - name: Log current directory
        run: |
          echo "Current directory: $(pwd)"
          echo "Listing files:"
          ls -la

      - name: Log Docker version
        run: |
          echo "Docker version:"
          docker --version
          echo "Docker Compose version:"
          docker compose version || docker-compose version

      - name: Build Custom Kong Image
        run: sudo docker build -t my-custom-kong:latest .

      - name: Validate docker-compose.yml
        run: sudo docker compose config || docker-compose config

      - name: Build the docker-compose
        run: sudo docker compose -f "docker-compose.yml" up -d || docker-compose -f "docker-compose.yml" up -d

      - name: List running containers
        run: sudo docker ps
