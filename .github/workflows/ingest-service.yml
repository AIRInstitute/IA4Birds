name: Build Ingest Service

on:
  push:
    paths:
      - 'ia4birds-all/ai4birds-ingest-service/**'

jobs:
  CheckOut:
    name: Check out
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v1

  DockerClean:
    name: Docker clean
    needs: CheckOut
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Stop ai4birds-ingest Container
        run: sudo docker stop ai4birds-ingest
        continue-on-error: true
      - name: Remove ai4birds-ingest Container
        run: sudo docker rm ai4birds-ingest
        continue-on-error: true
      - name: Remove ia4birds-all-ia4birds-ingest-service Image
        run: sudo docker rmi ia4birds-all-ia4birds-ingest-service
        continue-on-error: true

  DockerCompose:
    name: Docker compose
    needs: DockerClean
    runs-on: [self-hosted, linux, x64]
    steps:
     - name: Build Custom Kong Image
        run: sudo docker build -t my-custom-kong:latest .
      - name: Build the docker-compose
        run: sudo docker compose -f "docker-compose.yml" up -d --build ai4birds-ingest-service