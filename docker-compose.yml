version: "3.9"
  
services: 

  postgresql:
    image: "postgres:14-alpine"
    container_name: postgres
    env_file:
      - /etc/envs/.env
    ports:
      - 5432:5432
    volumes:
      - /etc/ai4birds-ddbb-raw/data:/var/lib/postgresql/data
      - ./kong.sql:/docker-entrypoint-initdb.d/kong.sql
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=kong
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 30s
      timeout: 3s
      retries: 5
    networks:
      - ai4birds-net

  kong-prepare:
    image: kong:2.8.3-alpine
    command: "kong migrations bootstrap"
    restart: on-failure
    networks:
      - ai4birds-net
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_DATABASE: kong
      KONG_PG_USER: postgres
      KONG_PG_PASSWORD: postgres
    links:
      - postgres
    depends_on:
      - postgres

  kong:
    image: kong:2.8.3-alpine
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_DATABASE: kong
      KONG_PG_USER: postgres
      KONG_PG_PASSWORD: postgres
      KONG_ADMIN_LISTEN: "0.0.0.0:8001, 0.0.0.0:8444 ssl"
      KONG_DB_UPDATE_FREQUENCY: 1m
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    depends_on:
      - kong-prepare
    ports:
      - "8001:8001"
      - "8444:8444"
      - "8000:8000"
      - "8443:8443"
    networks:
      - ai4birds-net

  konga-prepare:
    image: pantsel/konga:0.14.9
    command: "-c prepare -a postgres -u postgresql://postgres:postgres@postgres:5432/konga_db"
    restart: on-failure
    links:
      - postgres
    depends_on:
      - postgres
  
  konga:
    image: pantsel/konga:0.14.9
    restart: unless-stopped
    networks:
      - ai4birds-net
    environment:
      DB_ADAPTER: postgres
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: konga_db
      NODE_ENV: development
    depends_on:
      - konga-prepare
    ports:
      - "1337:1337"
    networks:
      - ai4birds-net

  ai4birds-ai-service:
      build: ./ai4birds-ai-service
      container_name: ai4birds-ai
      ports:
      - 5000:5000
      networks:
      - ai4birds-net

  ai4birds-coordinate-service:
      build: ./ai4birds-coordinate-service
      container_name: ai4birds-coordinate
      ports:
      - 5001:5000
      networks:
      - ai4birds-net
     
  ai4birds-ingest-service:
      build: ./ai4birds-ingest-service
      container_name: ai4birds-ingest
      ports:
      - 5002:5000
      networks:
      - ai4birds-net

  networks:
    ai4birds-net:
      driver: bridge
